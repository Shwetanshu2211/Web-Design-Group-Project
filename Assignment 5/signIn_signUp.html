<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="images/furniture.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Studio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #FAF9F6;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .outer_container {
            position: relative;
            width: 40vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer_image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(5px);
        }

        .inner_container {
            position: relative;
            width: 30%;
            height: 30%;
            backdrop-filter: none;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        .right_container {
            width: 60vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #FAF9F6;
        }

        .right_container h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            width: 80%;
            max-width: 400px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        #signUp {
            margin-top: 10px;
            font-size: 14px;
        }

        #signUp a {
            color: #007BFF;
            text-decoration: none;
            font-weight: bold;
        }

        #signUp a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="outer_container">
            <img class="outer_image" src="images/signUp_background.jpg" alt="signUp_image">
            <div class="inner_container">
                <img src="images/logo.png" alt="logo_image">
            </div>
        </div>

        <div class="right_container">
            <h2 id="title">Sign In</h2>

            <form id="authForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                
                <button type="submit" class="btn btn-dark w-100 mt-2">Login</button>

                <p id="signUp">Don't have an account? <a href="#" id="toggleForm">Sign Up</a></p>
            </form>
        </div>
    </main>
</body>
</html>
